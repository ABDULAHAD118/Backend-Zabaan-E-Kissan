name: 🚀 Deploy Backend to Zabaan-E-Kissan

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          ssh-keyscan -H 206.189.140.248 >> ~/.ssh/known_hosts

      - name: Deploy Backend via SSH
        run: |
          ssh -i ~/.ssh/id_rsa root@206.189.140.248 "
            cd /root/Price-Scrapping || \
              git clone git@github.com:ABDULAHAD118/Price-Scrapping.git /root/Price-Scrapping;

            cd /root/Price-Scrapping &&
            git pull origin main &&
            source venv/bin/activate &&
            pip install -r requirements.txt &&
            sudo systemctl restart fastapi
          "
