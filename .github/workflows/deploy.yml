name: 🚀 Deploy FastAPI Backend to Zabaan-E-Kissan

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 206.189.140.248 >> ~/.ssh/known_hosts

      - name: Deploy FastAPI via SSH
        run: |
          ssh -i ~/.ssh/id_ed25519 root@206.189.140.248 "
            cd /root/Price-Scrapping || \
              git clone git@github.com:ABDULAHAD118/Price-Scrapping.git /root/Price-Scrapping;

            cd /root/Price-Scrapping &&
            git pull origin main &&

            # Activate virtual environment (create if not exists)
            if [ ! -d 'venv' ]; then
              python3 -m venv venv
            fi

            source venv/bin/activate &&
            pip install --upgrade pip &&
            pip install -r requirements.txt &&

            # Restart FastAPI service
            sudo systemctl restart fastapi.service || true
          "
