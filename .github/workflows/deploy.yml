name: 🚀 Deploy Backend to Zabaan-E-Kissan

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          ssh-keyscan -H 206.189.140.248 >> ~/.ssh/known_hosts

      - name: Deploy Backend via SSH
        run: |
          ssh -i ~/.ssh/id_rsa root@206.189.140.248 << 'EOF'
          cd /root/Price-Scrapping || git clone https://github.com/ABDULAHAD118/Price-Scrapping.git /root/Price-Scrapping
          cd /root/Price-Scrapping

          # Pull latest code
          git pull origin main

          # Activate virtual environment
          source venv/bin/activate

          # Install/update dependencies
          pip install -r requirements.txt

          # Restart your FastAPI service
          sudo systemctl restart fastapi

          echo "✅ Deployment complete!"
          EOF
