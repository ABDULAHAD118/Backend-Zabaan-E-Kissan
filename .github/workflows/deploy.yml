name: 🚀 Deploy Backend to Zabaan-E-Kissan

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_rsa
          ssh-keyscan -H 68.183.90.5 >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no deploy@68.183.90.5 "echo '✅ SSH works from GitHub Actions!'"

      - name: Deploy Backend via SSH
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no deploy@68.183.90.5 "
            cd /home/deploy/Backend-Zabaan-E-Kissan;
            cd /home/deploy/Backend-Zabaan-E-Kissan &&
            git pull origin main &&
            source .venv/bin/activate &&
            pip install -r requirements.txt &&
            sudo systemctl restart fastapi &&
            echo '🚀 Deployment completed successfully!'
          "